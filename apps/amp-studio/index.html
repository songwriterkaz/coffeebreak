<!DOCTYPE html><html><head><meta charset="utf-8"><title>Coffeebreak Amp Studio</title>
<style>
body{margin:0;background:#1a0f0a;color:#f5e6d3;font-family:Arial,sans-serif;width:1280px;min-height:900px}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#2b1810;border-bottom:3px solid #d4a24c}
header img{height:70px;border-radius:8px}h1{margin:0;color:#d4a24c}
.row{display:flex;gap:14px;padding:10px 20px;flex-wrap:wrap}
.panel{background:#2b1810;border:1px solid #6b4426;border-radius:10px;padding:10px}
.knob{display:inline-block;text-align:center;margin:4px 8px;font-size:12px}.knob input{width:90px}
button{background:#d4a24c;border:0;border-radius:6px;padding:6px 12px;font-weight:bold;cursor:pointer}
button.on{background:#e04848;color:#fff}
#nr{font-size:22px;padding:16px 28px;background:#3fb27f;color:#fff}
.track{display:flex;align-items:center;gap:8px;margin:6px 0}canvas{background:#120a06;border-radius:4px}
#status{color:#d4a24c;padding:0 20px}
</style><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="cb-fullscreen.js"></script></head><body>
<header><img src="cb-logo.jpg" alt="Coffeebreak"><h1>Coffeebreak Amp Studio</h1></header>
<div class="row"><div class="panel"><b>Input</b><br><button id="start">Enable Mic / Line In</button>
<label><input type="checkbox" id="mon"> Monitor</label> <label><input type="checkbox" id="gate"> Live Noise Gate</label>
<span class="knob">Gate thr<br><input type="range" id="gthr" min="-80" max="-20" value="-50"></span></div>
<div class="panel"><b>Amp</b><br><span id="knobs"></span>
<label>Cab <select id="cab"><option value="1x12">1x12 Combo</option><option value="4x12">4x12 Stack</option><option value="off">Off (DI)</option></select></label></div></div>
<div class="row"><div class="panel"><b>Metronome</b> <input type="number" id="bpm" value="120" min="40" max="240" style="width:60px"> BPM <button id="met">Start</button></div>
<div class="panel"><button id="rec">● Record armed</button> <button id="play">▶ Play</button> <button id="stop">■ Stop</button> <button id="wav">Export Mix WAV</button></div>
<div class="panel"><button id="learn">Learn Noise (quiet section)</button> <button id="nr">Remove Background Noise</button></div></div>
<div id="status">Click "Enable Mic / Line In" to begin.</div>
<div class="row"><div class="panel" id="tracks" style="width:1200px"></div></div>
<script src="app.js"></script><div id="cb-tip" style="max-width:820px;margin:24px auto;padding:16px;background:#fff0f6;border-radius:16px;font-family:system-ui,sans-serif;color:#4a1030;text-align:center"><b>&#9749; Buy Karen a coffee</b><br>Send a coffee tip by PayID: <b>darkokaz@gmx.com</b> (Teachers Mutual Bank). Put the app name in the reference.<br><a href="../../" style="color:#d6336c">&larr; Coffeebreak hub</a></div>
</body></html>
