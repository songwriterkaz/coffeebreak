<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffeebreak Diary</title><style>
body{margin:0;font-family:Georgia,serif;background:#f5ebe0;color:#2b1a0f}
header{background:#4a2c1a;color:#f5ebe0;display:flex;align-items:center;gap:12px;padding:12px 16px}
header img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #d9b38c}
h1{font-size:1.5em;margin:0}main{max-width:720px;margin:auto;padding:12px}
.card{background:#fff8f0;border:1px solid #d9b38c;border-radius:12px;padding:14px;margin:12px 0}
h2{color:#4a2c1a;margin:0 0 8px}.nav{display:flex;justify-content:space-between;align-items:center}
button{background:#4a2c1a;color:#f5ebe0;border:0;border-radius:8px;padding:8px 14px;font-size:1em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}
.dow{font-weight:bold;font-size:.8em;color:#4a2c1a}.d{padding:10px 0;border-radius:8px;background:#f0e0cf;cursor:pointer;position:relative}
.d.today{background:#4a2c1a;color:#fff}.d.sel{outline:2px solid #b5651d}.d.has::after{content:"";position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#b5651d}
textarea{width:100%;box-sizing:border-box;min-height:180px;font:inherit;padding:8px;border-radius:8px;border:1px solid #d9b38c}
#news{white-space:pre-wrap}</style></head><body>
<header><img src="logo.jpg" alt="Coffeebreak logo"><h1>Coffeebreak Diary</h1></header><main>
<section class="card"><h2>Latest news</h2><div id="newsDate"></div><div id="news"></div></section>
<section class="card"><div class="nav"><button id="prev">&lt;</button><h2 id="mon"></h2><button id="next">&gt;</button></div><div class="grid" id="grid"></div></section>
<section class="card"><h2 id="dayT"></h2><textarea id="txt" placeholder="Dear Diary..."></textarea><p><button id="save">Save</button> <span id="msg"></span></p></section>
</main><script>
const K='cbDiary',seed={'2026-10-22':`Latest news (21-22 Oct 2026)

- The WifiPhone family grew: Lite, a fun Kids version with a HELP CALL MUM button and flashing siren, an iPhone "Call Mum" home-screen version, and Android apps for all of them.
- The 000 buttons now start switched off, with a tick and cross switch to change them.
- The Call Mum Phone pre-order page has its $10 Buy Now button working.
- 22 new YouTube Shorts on @coffeebreakTVSERIES, including the pink Shorts, Juicy Chocolate clips and 3 Dreadlock Store ads.
- The Dreadlock Store is getting a "Join Coffeebreak as a supplier" form.
- No new customer orders yet.`};
let db=JSON.parse(localStorage.getItem(K)||'{}');for(const k in seed)if(!(k in db))db[k]=seed[k];localStorage.setItem(K,JSON.stringify(db));
const p=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1),sel=key(now);
function showNews(){const ks=Object.keys(db).filter(k=>db[k].trim()).sort();const k=ks[ks.length-1];
newsDate.textContent=k?new Date(k+'T00:00').toDateString():'';document.getElementById("news").textContent=k?db[k]:'No entries yet.'}
function cal(){mon.textContent=view.toLocaleString('en-AU',{month:'long',year:'numeric'});grid.innerHTML='';
['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>grid.innerHTML+=`<div class="dow">${x}</div>`);
const off=(view.getDay()+6)%7;for(let i=0;i<off;i++)grid.innerHTML+='<div></div>';
const n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
for(let i=1;i<=n;i++){const k=key(new Date(view.getFullYear(),view.getMonth(),i));const e=document.createElement('div');
e.className='d'+(k===key(now)?' today':'')+(k===sel?' sel':'')+(db[k]&&db[k].trim()?' has':'');e.textContent=i;e.onclick=()=>{sel=k;cal();day()};grid.appendChild(e)}}
function day(){dayT.textContent=new Date(sel+'T00:00').toDateString();txt.value=db[sel]||'';msg.textContent=''}
prev.onclick=()=>{view.setMonth(view.getMonth()-1);cal()};next.onclick=()=>{view.setMonth(view.getMonth()+1);cal()};
save.onclick=()=>{db[sel]=txt.value;localStorage.setItem(K,JSON.stringify(db));msg.textContent='Saved.';cal();showNews()};
showNews();cal();day();</script><div id="cb-tip" style="max-width:820px;margin:24px auto;padding:16px;background:#fff0f6;border-radius:16px;font-family:system-ui,sans-serif;color:#4a1030;text-align:center"><b>&#9749; Buy Karen a coffee</b><br>Send a coffee tip by PayID: <b>darkokaz@gmx.com</b> (Teachers Mutual Bank). Put the app name in the reference.<br><a href="../../" style="color:#d6336c">&larr; Coffeebreak hub</a></div>
</body></html>
