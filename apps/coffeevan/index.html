<footer>© Coffeebreak</footer><script>
const $=i=>document.getElementById(i),cv=$('c'),cx=cv.getContext('2d');
const SPOTS=[{n:'Beach Carpark',x:150,y:120,e:'🏖',dem:1.3},{n:'Footy Oval',x:520,y:90,e:'🏉',dem:1.1},{n:'Hospital',x:980,y:130,e:'🏥',dem:1.5},{n:'Weekend Market',x:300,y:420,e:'🧺',dem:1.6},{n:'Building Site',x:760,y:430,e:'🏗',dem:1.4},{n:'Uni Campus',x:1050,y:440,e:'🎓',dem:1.2}];
const MENU=[['Flat White','☕',5],['Latte','🥛',5.5],['Cappuccino','☁️',5.5],['Long Black','⚫',4.5],['Mocha','🍫',6],['Chai','🫖',5.5],['Babycino','🧸',2]];
let G=JSON.parse(localStorage.getItem('cbvan')||'null')||{cash:50,day:1,beans:40,milk:20,rep:3,upg:{grinder:0,machine:0,van:0}};
let van={x:600,y:280,tx:600,ty:280},spot=null,q=[],cur=null,step=[],timeLeft=90,open=false,tick=0;const sv=()=>localStorage.setItem('cbvan',JSON.stringify(G));
const hud=()=>$('hud').textContent=`Day ${G.day} · $${G.cash.toFixed(2)} · Beans ${G.beans} · Milk ${G.milk} · ⭐${G.rep.toFixed(1)} · ⏱${Math.ceil(timeLeft)}s`;
const msg=m=>$('msg').textContent=m;
function ctl(){if(!open){$('ctl').innerHTML=`<b>Tap a spot on the map to drive there.</b> <button id="buyB">Buy beans 20 ($15)</button><button id="buyM">Buy milk 10 ($8)</button><button id="upG">Upgrade grinder ($${60+G.upg.grinder*60})</button><button id="upM">Upgrade machine ($${120+G.upg.machine*120})</button><button id="upV">Upgrade van speed ($${80+G.upg.van*80})</button><button id="newday">🌅 Start day ${G.day}</button>`;
$('buyB').onclick=()=>buy(15,()=>G.beans+=20);$('buyM').onclick=()=>buy(8,()=>G.milk+=10);$('upG').onclick=()=>buy(60+G.upg.grinder*60,()=>G.upg.grinder++);$('upM').onclick=()=>buy(120+G.upg.machine*120,()=>G.upg.machine++);$('upV').onclick=()=>buy(80+G.upg.van*80,()=>G.upg.van++);$('newday').onclick=()=>{timeLeft=90+G.upg.machine*10;open=true;msg('Day '+G.day+' started — drive to a busy spot and serve!');ctl()};return}
if(!cur){$('ctl').innerHTML=spot?`<b>${spot.e} ${spot.n}</b> — ${q.length} waiting. <button id="next">Take next order</button>`:'<b>Driving… tap a spot.</b>';if($('next'))$('next').onclick=()=>{if(!q.length){msg('No one waiting. Wait a moment or move spot.');return}cur=q.shift();step=[];ctl()};return}

$('ctl').innerHTML=`<b>Order: ${cur.d[1]} ${cur.d[0]} for ${cur.name}</b> `+steps.map((s,i)=>`<button data-s="${i}" ${step.length!=i?'disabled':''}>${i<step.length?'✅ ':''}${s}</button>`).join('');
$('ctl').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{step.push(+b.dataset.s);if(step.length==steps.length)serve(needMilk);else ctl()})}
function buy(c,f){if(G.cash<c){msg('Not enough cash.');return}G.cash-=c;f();sv();hud();ctl()}
function serve(needMilk){if(G.beans<1||(needMilk&&G.milk<1)){msg('Out of stock! Restock after the day.');cur=null;ctl();return}G.beans--;if(needMilk)G.milk--;const wait=(performance.now()-cur.t)/1000,tip=wait<15?1.5:wait<30?.5:0;const pay=cur.d[2]+tip;G.cash+=pay;G.rep=Math.min(5,G.rep+(tip>1?.05:tip>0?0:-.1));msg(`Served ${cur.name} a ${cur.d[0]} — $${pay.toFixed(2)}${tip?' (incl. tip)':''}. ${['Cheers!','Legend!','Best coffee in town!','Ta, love!'][Math.random()*4|0]}`);cur=null;sv();ctl();hud()}
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*1200/r.width,y=(e.clientY-r.top)*560/r.height;const s=SPOTS.find(s=>Math.hypot(s.x-x,s.y-y)<70);if(s){van.tx=s.x;van.ty=s.y+50;spot=null;q=[];cur=null;ctl();msg('Driving to '+s.n+'…')}};
const NAMES=['Kaz','Dakota','Bazza','Shazza','Mick','Jess','Tayla','Nan','Coach','Doc','Tradie Tom','Uni Sam'];
function loop(){tick++;const sp=3+G.upg.van*1.5;const dx=van.tx-van.x,dy=van.ty-van.y,d=Math.hypot(dx,dy);if(d>2){van.x+=dx/d*Math.min(sp,d);van.y+=dy/d*Math.min(sp,d)}else if(!spot){spot=SPOTS.find(s=>Math.hypot(s.x-van.x,s.y+50-van.y)<5)||null;if(spot)msg('Parked at '+spot.n+'. Customers coming!');ctl()}
if(open){timeLeft-=1/60;if(spot&&Math.random()<.012*spot.dem*(G.rep/3)&&q.length<6){q.push({name:NAMES[Math.random()*NAMES.length|0],d:MENU[Math.random()*MENU.length|0],t:performance.now()});if(!cur)ctl()}
if(q.length&&performance.now()-q[0].t>45000){q.shift();G.rep=Math.max(1,G.rep-.15);msg('A customer gave up waiting 😞')}
if(timeLeft<=0){open=false;G.day++;G.cash-=10;msg(`Day over! Fuel & rego -$10. Cash $${G.cash.toFixed(2)}. Restock and upgrade, then start the next day.`);q=[];cur=null;sv();ctl()}}
cx.fillStyle='#3a5a34';cx.fillRect(0,0,1200,560);cx.strokeStyle='#5a5a5a';cx.lineWidth=40;cx.beginPath();cx.moveTo(150,170);cx.lineTo(520,140);cx.lineTo(980,180);cx.lineTo(1050,490);cx.lineTo(760,480);cx.lineTo(300,470);cx.lineTo(150,170);cx.moveTo(520,140);cx.lineTo(760,480);cx.stroke();
SPOTS.forEach(s=>{cx.font='54px serif';cx.fillText(s.e,s.x-27,s.y+15);cx.fillStyle='#f4e8d8';cx.font='bold 16px system-ui';cx.fillText(s.n,s.x-50,s.y+40);cx.fillStyle='#3a5a34'});
cx.font='56px serif';cx.fillText('🚐',van.x-28,van.y+18);cx.fillStyle='#c8894a';cx.font='bold 13px system-ui';cx.fillText('COFFEEBREAK',van.x-40,van.y+34);
if(spot)q.forEach((c,i)=>{cx.font='30px serif';cx.fillText('🧍',van.x+40+i*28,van.y+20)});hud();requestAnimationFrame(loop)}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{['game','shop'].forEach(t=>$(t).style.display=t==b.dataset.t?'':'none');document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x==b))});
ctl();msg('Welcome to Coffeebreak Coffee Van! Restock, then start the day.');loop();</script><!--cb-bar-fix--><style>#cbBar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;background:#000;border-top:3px solid #d4af37;border-bottom:3px solid #d4af37;padding:12px;position:relative;z-index:5}#cbBar>*{position:static!important;left:auto!important;right:auto!important;bottom:auto!important;top:auto!important;transform:none!important;margin:0!important}#cbBar #cbc-float{display:inline-block;background:#d4af37!important;color:#000!important;font:700 17px system-ui,sans-serif!important;padding:12px 22px!important;border-radius:999px}</style>
