<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MidwifeSim: Virtual Birthing Manikin</title>
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#1b2a3a; --muted:#5d6b7c; --line:#dfe5ee;
  --pri:#0b7a83; --pri2:#0e9aa5; --priSoft:#e3f4f5;
  --ok:#1f9d63; --okSoft:#e7f7ef; --bad:#d64b3c; --badSoft:#fdeeec; --warn:#b97c00; --warnSoft:#fff5dc;
  --mon:#0b1622; --mon2:#122238; --monLine:#20385a;
  --radius:14px; --shadow:0 1px 2px rgba(16,30,54,.06),0 8px 24px rgba(16,30,54,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:clip}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #7cc9cf;outline-offset:2px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;height:100vh;height:100dvh;overflow:hidden;max-width:100vw}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);min-height:54px;min-width:0;max-width:100vw}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#34b3a0);display:grid;place-items:center;flex:0 0 auto}
.brand h1{font-size:15px;margin:0;line-height:1.15;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.stepper{display:flex;gap:4px;flex:1 1 auto;justify-content:safe center;min-width:0;overflow:hidden}
.stepper .st{font-size:11.5px;padding:5px 9px;border-radius:999px;background:#f1f4f8;color:var(--muted);white-space:nowrap;border:1px solid transparent;font-weight:600}
.stepper .st.done{background:var(--priSoft);color:var(--pri)}
.stepper .st.active{background:var(--pri);color:#fff}
.hctl{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pill{display:flex;align-items:center;gap:6px;background:#f1f4f8;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
.seg{display:flex;background:#f1f4f8;border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:#c4cfdd;background:#fafcfe}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#09666e}
.btn.big{padding:12px 20px;font-size:15px;border-radius:12px}
.modeBadge{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#eef6ff;color:#2a5d9f;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.modeBadge.comp{background:#fff1ec;color:#b2492d}
.stageMini{display:none;font-size:12px;font-weight:700;color:var(--pri)}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;padding:12px 12px 0;min-height:0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);min-height:0;position:relative}
.illus{display:flex;flex-direction:column;overflow:hidden}
.illusHead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0;gap:8px}
.illusHead h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.illusHead .note{font-size:11.5px;color:var(--muted)}
.svgWrap{flex:1 1 auto;min-height:0;position:relative}
#mainSvg{width:100%;height:100%;display:block}
.inset{position:absolute;left:10px;top:6px;width:150px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:6px 6px 4px;box-shadow:0 4px 14px rgba(16,30,54,.08)}
.inset .t{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.inset svg{width:100%;display:block}
.inset .cap{font-size:11.5px;text-align:center;font-weight:700;color:var(--ink)}
.drape{position:absolute;right:10px;top:6px;width:118px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:none;box-shadow:0 4px 14px rgba(16,30,54,.08)}
.drape .t{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.drape .gauge{position:relative;height:96px;margin:6px 0 2px 30px;border:2px solid #9fb2c6;border-top:0;border-radius:0 0 10px 10px;background:#f7fafc;overflow:hidden}
.drape .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#c8505f,#a83347);height:0;transition:height .4s}
.drape .ticks{position:absolute;left:-30px;top:0;bottom:0;width:30px;font-size:9px;color:var(--muted)}
.drape .ticks span{position:absolute;right:4px;transform:translateY(50%)}
.drape .ticks span::after{content:"";position:absolute;right:-6px;top:50%;width:5px;border-top:1px solid #9fb2c6}
.drape .rd{font-size:12px;font-weight:700;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px 10px;justify-content:center}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:#f1f4f8;color:#8592a3;font-weight:600;border:1px solid transparent;transition:all .3s}
.chip.active{background:#fff6dc;color:#8a6200;border-color:#f0d58a}
.chip.done{background:var(--okSoft);color:var(--ok)}
.chip.done::before{content:"✓ "}

/* scenario */
.scen{display:flex;flex-direction:column;overflow:hidden}
.scenTop{padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pri);background:var(--priSoft);padding:3px 8px;border-radius:6px}
.stepNo{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.prog{height:4px;background:#eef2f7;border-radius:4px;overflow:hidden;margin:0 16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#34b3a0);width:0;transition:width .4s}
.scenBody{padding:12px 16px 16px;overflow:auto;flex:1 1 auto;min-height:0}
.scenBody h2{margin:2px 0 8px;font-size:19px;line-height:1.25}
.scenBody p{margin:0 0 10px}
.narr{color:#2c3b4d}
.q{font-weight:700;margin:12px 0 8px!important}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;transition:border-color .15s,background .15s,transform .05s;font-size:14px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--pri2);background:#f6fcfc}
.opt:active:not(:disabled){transform:scale(.995)}
.opt .key{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:#eef2f7;color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okSoft)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:#efb3aa;background:var(--badSoft);color:#8b3a30}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.missed{border-color:#f0d58a;background:var(--warnSoft)}
.opt.missed .key{background:var(--warn);color:#fff}
.opt.sel{border-color:var(--pri);background:var(--priSoft)}
.opt.sel .key{background:var(--pri);color:#fff}
.opt.done{border-color:var(--ok);background:var(--okSoft)}
.opt.done .key{background:var(--ok);color:#fff}
.opt:disabled:not(.correct):not(.wrong):not(.done):not(.missed):not(.sel){opacity:.55}
.opt .why{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:400}
.fbBox{margin-top:12px}
.fb{border-radius:11px;padding:10px 12px;font-size:14px;animation:pop .25s ease-out;border-left:4px solid}
.fb b.h{display:block;margin-bottom:2px}
.fb.ok{background:var(--okSoft);border-color:var(--ok)}
.fb.bad{background:var(--badSoft);border-color:var(--bad)}
.fb.warn{background:var(--warnSoft);border-color:var(--warn)}
.fb.info{background:#eef5ff;border-color:#4a7fc1}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.findings{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.findings li{background:#f6f9fc;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px;animation:pop .25s}
.findings li::before{content:"✓";color:var(--ok);font-weight:800;margin-right:6px}
.contBar{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.contBar .pts{margin-right:auto;align-self:center;font-weight:700;font-size:13px;color:var(--muted)}
.hintSmall{font-size:12.5px;color:var(--muted)}

/* push */
.pushPanel{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe;margin-top:8px}
.meterRow{display:flex;gap:12px;align-items:center}
.meter{flex:1;height:22px;border-radius:11px;background:#e9eef4;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7fc6cb,#0b7a83);width:0}
.meter .thr{position:absolute;top:0;bottom:0;left:30%;border-left:2px dashed rgba(0,0,0,.25)}
.cstate{font-weight:800;min-width:150px;text-align:right;font-size:14px}
.cstate.go{color:var(--ok)}
.pushBtn{margin-top:12px;width:100%;padding:20px;font-size:18px;font-weight:800;border:0;border-radius:14px;background:linear-gradient(135deg,#0b7a83,#18a39a);color:#fff;letter-spacing:.04em;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 6px 16px rgba(11,122,131,.25);transition:transform .08s,filter .1s}
.pushBtn.held{transform:scale(.98);filter:brightness(1.12);box-shadow:0 0 0 6px rgba(24,163,154,.25)}
.pushBtn.cue{animation:cue 1s infinite}
@keyframes cue{50%{box-shadow:0 0 0 8px rgba(31,157,99,.3)}}
.pstats{display:flex;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pstats b{color:var(--ink)}
.descent{height:10px;border-radius:5px;background:#e9eef4;overflow:hidden;margin-top:8px}
.descent i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b37e,#e0795a);transition:width .3s}
.advBtn{margin-top:6px}

/* apgar */
.apgar{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13.5px}
.apgar td{vertical-align:middle;padding:6px 8px;background:#f8fafc;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.apgar td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px;font-weight:700;width:28%}
.apgar td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0;width:132px;text-align:right}
.apgar .obs{color:#2c3b4d}
.apgar .ans{display:block;font-size:12px;margin-top:3px;font-weight:600}
.sc{display:inline-flex;gap:3px}
.sc button{width:34px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:800}
.sc button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sc button.right{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff}
.sc button.wrongpick{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff}
.legendTbl{font-size:12px;color:var(--muted);margin-top:4px}

/* ebl */
.eblRow{display:flex;gap:12px;align-items:center;margin-top:8px}
.eblRow input[type=range]{flex:1;accent-color:var(--pri)}
.eblOut{font-weight:800;font-size:18px;min-width:90px;text-align:right;font-variant-numeric:tabular-nums}

/* placenta illustration */
.placFig{display:block;width:100%;max-width:440px;margin:4px auto 6px;background:#fbf7f7;border-radius:12px;border:1px solid var(--line)}

/* ---------- monitor ---------- */
.monitor{margin:12px;background:var(--mon);border-radius:var(--radius);color:#d8e6f5;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px;padding:10px;box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{background:var(--mon2);border:1px solid var(--monLine);border-radius:10px;padding:6px 8px;min-width:0;position:relative}
.tile .tl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8fa6c0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden}
.tile .tv small{font-size:11px;font-weight:600;color:#8fa6c0;margin-left:3px}
.tile .ts{font-size:10.5px;color:#7f95ae;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile[data-c=g] .tv{color:#5ee08f}.tile[data-c=y] .tv{color:#ffd166}.tile[data-c=c] .tv{color:#5fd4e8}
.tile[data-c=w] .tv{color:#e8eef6}.tile[data-c=p] .tv{color:#f49ac1}.tile[data-c=o] .tv{color:#ffb36b}
.tile.na .tv{color:#4f6683!important}
.tile.alarm{border-color:#ff5d5d;animation:alarm 1s infinite}
.tile.alarm .tv{color:#ff7a7a!important}
@keyframes alarm{50%{background:#3a1520}}
.ctgWrap{background:#fffaf6;border-radius:10px;position:relative;min-height:150px;overflow:hidden}
.ctgWrap canvas{position:absolute;inset:0;width:100%;height:100%}
.ctgLbl{position:absolute;right:8px;top:4px;font-size:10.5px;color:#9a6b5f;font-weight:700;z-index:1;background:rgba(255,250,246,.8);padding:0 4px;border-radius:4px}
footer{font-size:11.5px;color:var(--muted);text-align:center;padding:0 12px 10px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,26,42,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px 12px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;max-width:780px;width:100%;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto}
.modal h1{margin:4px 0 6px;font-size:26px}
.modal .lead{color:#3b4a5c;font-size:15.5px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 10px}
.mode{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;background:#fff}
.mode b{display:block;font-size:15px;margin-bottom:3px}
.mode span{font-size:12.5px;color:var(--muted)}
.mode.on{border-color:var(--pri);background:var(--priSoft)}
.comps{display:none;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.comps.show{display:flex}
.comps label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;font-weight:600;cursor:pointer}
.comps input{accent-color:var(--pri);width:16px;height:16px}
.disc{background:#fff8e6;border:1px solid #f0d58a;border-radius:12px;padding:10px 12px;font-size:13px;color:#5e4a12;margin:12px 0}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.howto div{background:#f6f9fc;border-radius:12px;padding:10px;font-size:12.5px;color:#3b4a5c}
.howto b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.startRow{display:flex;align-items:center;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.debrief h2{margin:0 0 4px}
.scoreRing{display:flex;align-items:center;gap:18px;margin:10px 0 14px;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;flex:0 0 auto}
.ring span{background:#fff;width:84px;height:84px;border-radius:50%;display:grid;place-items:center}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.kv div{background:#f6f9fc;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:16px;color:var(--ink)}
.res{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.res li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.res li .rh{display:flex;gap:8px;align-items:center;font-weight:700}
.res li .rh em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums}
.res li.perfect .rh em{color:var(--ok)}
.res li.partial{background:#fffbf0}
.res li .lp{color:#3b4a5c;margin-top:3px;font-size:13px}
.res li .err{color:#8b3a30;font-size:12.5px;margin-top:2px}
.keypts{padding-left:18px;margin:6px 0 0}
.keypts li{margin-bottom:4px;font-size:13.5px}
details.revw summary{cursor:pointer;font-weight:700;margin:12px 0 6px}

/* ---------- svg styles ---------- */
.lbl{font-size:10px;fill:#6b7b8e;font-weight:600}
.lbl.strong{fill:#1b2a3a;font-weight:700}
.fskin{fill:#f3cdb4;stroke:#c9977c;stroke-width:1.5}
.fline{fill:none;stroke:#a9765d;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.cordS{fill:none;stroke:#b9c7e6;stroke-width:6;stroke-linecap:round}
.cordE{fill:none;stroke:#8597c2;stroke-width:1.2;stroke-dasharray:3 4}
.breathe{animation:br 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes br{50%{transform:scale(1.025)}}
.pulseA{animation:pa 1.2s ease-in-out infinite}
@keyframes pa{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.breathe,.pulseA,.tile.alarm,.pushBtn.cue{animation:none}}

/* ---------- responsive ---------- */
@media (max-width:1400px){.brand small{display:none}.rlbl{display:none}.modeBadge{max-width:170px}}
@media (max-width:1360px){.stepper{gap:3px}.stepper .st{padding:4px 7px;font-size:11px}header{gap:10px}}
@media (max-width:1040px){.stepper{display:none}.stageMini{display:block;flex:1;text-align:center}}
@media (max-width:900px),(max-height:620px){
  .app{display:block;height:auto;overflow:visible}
  header{position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:8px}
  .main{grid-template-columns:1fr;padding:10px 10px 0}
  .illus{height:auto}
  .svgWrap{height:min(78vw,440px)}
  .scenBody{overflow:visible}
  .monitor{grid-template-columns:1fr;margin:10px}
  .ctgWrap{height:170px}
}
@media (max-width:600px){
  body{font-size:14.5px}
  .brand h1{font-size:14px}
  .hctl .pill.clock,.modeBadge{display:none}
  .stageMini{order:5;flex-basis:100%;text-align:left}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile .tv{font-size:19px}
  .opts.grid{grid-template-columns:1fr}
  .inset{width:112px;left:6px;top:4px;padding:4px}
  .inset .cap{font-size:10px}
  .drape{width:100px;transform:scale(.9);transform-origin:right top}
  .modes,.howto{grid-template-columns:1fr}
  .kv{grid-template-columns:repeat(2,1fr)}
  .modal{padding:18px 16px}
  .apgar td:first-child{width:auto}
  .apgar td:last-child{width:auto}
  .svgWrap{height:86vw}
}
@media print{.overlay{position:static;background:none;backdrop-filter:none;display:block}.app,#startOv{display:none!important}.modal{box-shadow:none}}
</style>
</head>
