<script>/*cb-bar-fix: move overlapping floating buttons into a clear bar under the header*/(function(){function fx(e){var s=getComputedStyle(e),r=e.getBoundingClientRect();return s.position=='fixed'&&s.display!='none'&&r.width>0&&r.height>0}function ov(a,b){a=a.getBoundingClientRect();b=b.getBoundingClientRect();return a.left<b.right-4&&b.left<a.right-4&&a.top<b.bottom-4&&b.top<a.bottom-4}function go(){var em=document.getElementById('cbc-float');if(!em||em.closest('#cbBar'))return;var others=[].filter.call(document.querySelectorAll('body *'),function(e){return e!==em&&!e.contains(em)&&!em.contains(e)&&fx(e)&&e.getBoundingClientRect().width<700&&ov(e,em)});if(!others.length)return;var bar=document.getElementById('cbBar');if(!bar){bar=document.createElement('nav');bar.id='cbBar';bar.setAttribute('aria-label','Listen and contact');var h=document.querySelector('body > header, header');if(h&&h.getBoundingClientRect().top<200&&getComputedStyle(h).position!='fixed')h.parentNode.insertBefore(bar,h.nextSibling);else document.body.insertBefore(bar,document.body.firstChild)}others.forEach(function(o){if(/radio|suno|listen|music|♫|📻/i.test(o.innerText||o.id||''))bar.appendChild(o)});bar.appendChild(em)}function run(){[300,1500,4000].forEach(function(t){setTimeout(go,t)})}if(document.readyState=='complete')run();else addEventListener('load',run)})();</script>
