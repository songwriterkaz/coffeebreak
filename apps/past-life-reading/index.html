<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffeebreak Past Life Reading</title>
<style>
body{margin:0;font-family:Georgia,serif;color:#3a1f2a;background:#f9c9dc url(bg.png) repeat;background-size:260px;min-height:100vh}
header{text-align:center;padding:22px 10px 6px}header img{width:96px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px #c2185b44}
h1{margin:8px 0 2px;font-size:clamp(26px,5vw,40px);color:#a3134f;letter-spacing:1px}header p{margin:0;font-style:italic;color:#8a1d55}
.box{max-width:640px;margin:16px auto;background:#fff8fbee;border:2px solid #ff8fc4;border-radius:22px;padding:22px;box-shadow:0 10px 30px #c2185b33}
label{display:block;margin:10px 0 4px;font-weight:700}input{width:100%;box-sizing:border-box;padding:10px;border:2px solid #ffb3d6;border-radius:12px;font:inherit;background:#fff}
.q{margin:16px 0}.q b{display:block;margin-bottom:6px}.opts{display:flex;flex-wrap:wrap;gap:6px}.opts button{background:#fff;color:#3a1f2a;border:2px solid #ffb3d6;border-radius:18px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}.opts button.on{background:#ff4fa3;color:#fff;border-color:#c2185b}
.btn{background:#ff4fa3;color:#fff;border:2px solid #a3134f;border-radius:24px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;margin:6px 4px}.btn.g{background:#fff;color:#a3134f}
#prog{height:8px;background:#ffd6ea;border-radius:8px;overflow:hidden;margin:8px 0}#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fc4,#c2185b);transition:width .3s}
#reveal{display:none;text-align:center;padding:40px 0}.orb{width:150px;height:150px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffb3d6 35%,#c2185b 80%);box-shadow:0 0 40px #ff4fa3,0 0 90px #ff8fc4;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.9) rotate(0);filter:hue-rotate(0)}to{transform:scale(1.08) rotate(20deg);filter:hue-rotate(25deg)}}
.stars span{position:absolute;color:#fff;animation:tw 1.6s infinite alternate}@keyframes tw{from{opacity:.2}to{opacity:1}}
#reading{display:none}#reading section{opacity:0;transform:translateY(14px);animation:up .8s forwards;margin:12px 0;padding:12px 14px;background:#fff;border-radius:14px;border-left:5px solid #ff4fa3}
@keyframes up{to{opacity:1;transform:none}}#reading h2{text-align:center;color:#a3134f;margin:4px 0}#reading .sub{text-align:center;font-style:italic;color:#8a1d55}#reading h3{margin:0 0 4px;color:#c2185b;font-size:15px;text-transform:uppercase;letter-spacing:1px}
.aff{font-size:20px;text-align:center;font-style:italic;color:#a3134f}#cardimg{max-width:100%;border-radius:14px;margin-top:10px;display:none}textarea{width:100%;box-sizing:border-box;height:90px;border:2px solid #ffb3d6;border-radius:12px;font:inherit;padding:8px}
footer{text-align:center;font-size:13px;color:#8a1d55;padding:18px}
</style><script id="cb-pages-bar-script" src="https://songwriterkaz.github.io/coffeebreak/pages/cb-pages-bar.js" defer></script>
</head><body>
<header><img src="logo.jpg" alt="Coffeebreak logo"><h1>Coffeebreak Past Life Reading</h1><p>Pour a cup, take a breath, and meet who you once were.</p></header>
<div class="box" id="form">
<label>Your name<input id="nm" placeholder="First name or nickname"></label>
<label>Date of birth<input id="dob" type="date"></label>
<label>Birthplace<input id="bp" placeholder="Town or city"></label>
<p style="margin-top:18px">Answer with your first instinct.</p><div id="prog"><i></i></div><div id="qs"></div>
<div style="text-align:center"><button class="btn" id="go">Reveal my past life</button><div id="err" style="color:#c2185b"></div></div></div>
<div class="box" id="reveal"><div class="orb"></div><p id="rmsg" style="font-style:italic;margin-top:24px">Stirring the coffee of time...</p></div>
<div class="box" id="reading"></div>
<footer>For reflection and entertainment . Coffeebreak . coffeebreaks.itch.io</footer>
<script src="data.js"></script><script src="app.js"></script></body></html>
